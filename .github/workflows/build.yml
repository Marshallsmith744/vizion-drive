name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No wrapper jar is committed, so use a pinned Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VizionDrive-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VizionDrive-build-${{ github.run_number }}
          path: VizionDrive-build-${{ github.run_number }}.apk

      # Each successful build also appears under Releases for a one-click download.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vizion Drive build ${{ github.run_number }}
          prerelease: true
          files: VizionDrive-build-${{ github.run_number }}.apk
